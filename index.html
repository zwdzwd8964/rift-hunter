<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>裂隙猎人</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="裂隙猎人">
<meta name="theme-color" content="#0b0912">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  html, body { margin: 0; padding: 0; background: #0b0912; overflow: hidden; width: 100%; height: 100%;
               touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
               -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { position: fixed; inset: 0; }
  canvas { display: block; cursor: crosshair; outline: none; }
  #autotest-result { display: none; }
</style>
<script>
  (function () {
    function report(msg) {
      try {
        var d = document.getElementById('autotest-result');
        if (d) d.appendChild(document.createTextNode(' [ERR' + 'OR] ' + msg + ' '));
      } catch (e) { /* 忽略 */ }
    }
    window.onerror = function (m, src, line) { report(m + ' @' + String(src || '').split('/').pop() + ':' + line); };
    window.addEventListener('unhandledrejection', function (e) { report('unhandledrejection ' + ((e && e.reason && e.reason.message) || (e && e.reason))); });
  })();
</script>
</head>
<body>
<canvas id="c" width="960" height="540" tabindex="0"></canvas>
<div id="autotest-result"></div>
<script src="js/touch.js"></script>
<script src="js/core.js"></script>
<script src="js/gfx.js"></script>
<script src="js/data_chars.js"></script>
<script src="js/data_items.js"></script>
<script src="js/data_enemies.js"></script>
<script src="js/world.js"></script>
<script src="js/sim.js"></script>
<script src="js/items.js"></script>
<script src="js/enemies.js"></script>
<script src="js/bosses.js"></script>
<script src="js/meta.js"></script>
<script src="js/sprites.js"></script>
<script src="js/fx.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/hud.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<script>
  // 离线：第一次在线打开后，所有文件都缓存在手机上
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
</body>
</html>
